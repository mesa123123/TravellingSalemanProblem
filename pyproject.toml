[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "travelling_salesman_problem"
version = "0.2.0"
description = "This is an old university project I've refactored for a job interview"
authors = [{ name = "Peter Bowman", email = "bowmanpete123@gmail.com" }]
license = "MIT"
requires-python = ">=3.12"
dependencies = ["matplotlib", "numpy", "pandas"]

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups] # Standardized key is [project.optional-dependencies]
dev = ["ruff", "ty", "debugpy", "pytest", "docformatter", "python-lsp-server"]

# --- RUFF: LINTER CONFIGURATION ---
[tool.ruff]
src = ["src"]            # Only need to list top-level source dir
line-length = 120
target-version = "py312" # Consistent with [project] requires-python

[tool.ruff.lint] # <-- NEW: Correct, non-deprecated location
select = ["E", "F", "W", "I"]

# --- TY: Type Checker Config (Simplify to debug) ---
[tool.ty.environment]
root = ["src"] # Simplified path

[tool.pytest.ini_options]
pythonpath = [
  "src",
] # Simplified path, assuming 'src' contains all top-level modules
testpaths = ["tests"]
norecursedirs = [".git", "venv", "docs"]

[tool.docformatter]
line_length = 120
pre_summary_newline = true
post_summary_newline = true
make_summary_multi_line = false
force_wrap = false
use_double_quotes = true
